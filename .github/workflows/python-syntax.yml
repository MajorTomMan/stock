name: Python syntax and unit checks

on:
  push:
    branches:
      - master
      - feature/data-quality-publication
  pull_request:
    paths:
      - "backend/stock_data/**"
      - "backend/tests/**"
      - "backend/requirements.txt"
      - ".github/workflows/python-syntax.yml"

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile sources and tests
        run: python -m compileall -q backend/stock_data backend/tests
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run offline unit tests
        working-directory: backend
        run: python -m unittest discover -s tests -v
