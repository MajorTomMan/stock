name: Python syntax and unit checks

on:
  push:
    branches:
      - master
      - feature/data-quality-publication
  pull_request:
    paths:
      - "ingestion/**"
      - "backend/python/**"
      - ".github/workflows/python-syntax.yml"

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: python -m compileall -q ingestion/src ingestion/tests backend/python
      - name: Install Python packages
        run: |
          python -m pip install -e ./ingestion
          python -m pip install -r backend/python/requirements.txt
      - name: Run offline unit tests
        working-directory: ingestion
        run: python -m unittest discover -s tests -v
      - name: Verify market API imports and routes
        env:
          PYTHONPATH: backend/python
        run: |
          python - <<'PY'
          from market_api.app import app
          paths = {route.path for route in app.routes}
          assert {"/health", "/api/instruments", "/api/instruments/{symbol}/daily", "/api/market/overview"} <= paths
          PY
