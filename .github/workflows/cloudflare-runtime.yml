name: Cloudflare runtime checks

on:
  pull_request:
    paths:
      - "cloudflare/**"
      - "wrangler.jsonc"
      - "package.json"
      - "Dockerfile.cloudflare"
      - ".dockerignore"
      - ".github/workflows/cloudflare-runtime.yml"

jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Worker dependencies
        run: npm install
      - name: Validate Wrangler config and Worker bundle
        run: npx wrangler deploy --dry-run --outdir .wrangler-dist
