[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-market-data"
version = "0.1.0"
description = "A-share market data ingestion and PostgreSQL access"
requires-python = ">=3.12"
dependencies = [
  "baostock>=0.8.9",
  "pandas>=2.2,<3",
  "openpyxl>=3.1,<4",
  "psycopg[binary]>=3.2,<4",
  "requests>=2.32,<3",
  "pyarrow>=17,<30",
]

[tool.setuptools]
packages = ["stock_data", "stock_data.providers"]
package-dir = { stock_data = "src" }
